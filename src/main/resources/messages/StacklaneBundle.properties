stale.title=Stack Without Branches
stale.text=The branches of {0} no longer exist, but gh stack still tracks it: it cannot be checked out, and its branch names cannot be reused for a new stack.\n\nForget: stops tracking it locally (gh stack unstack --local). Nothing changes on GitHub and your working tree is not touched.\n\nRecreate: forgets it and starts the same layers again on the base you choose (gh stack init --base), restoring their last commits when they are known.
