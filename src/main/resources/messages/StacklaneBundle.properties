# ------------------------------------------------------------------ acciones
action.Stacklane.Refresh.text=Refresh
action.Stacklane.Refresh.description=Read the stack and the state of its pull requests again
action.Stacklane.InitStack.text=New Stack…
action.Stacklane.InitStack.description=Start a new stack on any branch: choose its base and its layers, bottom to top. The dialog shows every command before running it
action.Stacklane.AddLayer.text=Add Layer on Top of Stack…
action.Stacklane.AddLayer.description=Create a new branch on top of the top layer of the stack, optionally committing your changes in it. If you are not on the top layer, it is checked out first
action.Stacklane.Publish.text=Publish Stack…
action.Stacklane.Publish.description=Push every layer of the stack and create the missing pull requests, choosing for each one whether it is ready for review or a draft, and the title and description of the new ones
action.Stacklane.PublishDraft.text=Publish Stack as Drafts
action.Stacklane.PublishDraft.description=Push every layer of the stack and create the missing pull requests as drafts. Existing pull requests keep their state
action.Stacklane.PublishReady.text=Publish Stack Ready for Review…
action.Stacklane.PublishReady.description=Push every layer of the stack and mark all its pull requests ready for review, existing drafts included. Shows which ones change before running
action.Stacklane.Sync.text=Sync with Remote
action.Stacklane.Sync.description=Fetch, rebase every layer onto the latest trunk, push them and update the pull requests. If the rebase hits conflicts, every branch is restored
action.Stacklane.CloseStack.text=Close Stack…
action.Stacklane.CloseStack.description=Unstack this stack, close its open pull requests and delete its branches. A dialog lists every pull request and branch it touches and lets you choose first
group.Stacklane.RebaseMenu.text=Rebase
group.Stacklane.RebaseMenu.description=Rebase the whole stack or only part of it. Each option shows its command
action.Stacklane.RebaseUpstack.text=Rebase Upstack from Current Layer
action.Stacklane.RebaseUpstack.description=Carry the current layer’s commits to the layers above it, without fetching or rebasing onto the trunk
action.Stacklane.Rebase.text=Rebase Whole Stack
action.Stacklane.Rebase.description=Fetch the trunk and rebase every layer, the bottom one onto the trunk
action.Stacklane.RebaseDownstack.text=Rebase Downstack to Current Layer
action.Stacklane.RebaseDownstack.description=Fetch the trunk and rebase the layers from the trunk up to the current one
action.Stacklane.RebaseLayers.text=Rebase Layers onto Each Other
action.Stacklane.RebaseLayers.description=Rebase every layer onto the one below, without fetching or touching the trunk
action.Stacklane.RebaseUpstackFromLayer.text=Rebase Upstack from Here
action.Stacklane.RebaseUpstackFromLayer.description=Carry this layer’s commits to the layers above it, without fetching or touching the trunk. If it is not the current branch, it is checked out first and you come back afterwards
action.Stacklane.OpenSettings.text=Settings…
action.Stacklane.OpenSettings.description=Open Settings | Version Control | Stacklane: the path to gh, the final-layer label and what to do after a commit
action.Stacklane.CheckoutLayer.text=Check Out Branch
action.Stacklane.CheckoutLayer.description=Switch to this layer’s branch with the IDE checkout, which offers to carry your local changes over if they are in the way
action.Stacklane.ShowLayerChanges.text=Show Layer Changes
action.Stacklane.ShowLayerChanges.description=Open the IDE diff with what this layer adds on top of the layer below: the same changes its pull request shows
action.Stacklane.ChangePrBase.text=Change Pull Request Base
action.Stacklane.ChangePrBase.description=Point this pull request at the layer below it, as the stack expects. Only this pull request changes
action.Stacklane.OpenPr.text=Open Pull Request in Browser
action.Stacklane.OpenPr.description=Open this layer’s pull request on GitHub, in the browser
action.Stacklane.CopyPrLink.text=Copy Pull Request Link
action.Stacklane.CopyPrLink.description=Copy the address of this layer’s pull request to the clipboard
action.Stacklane.MarkReady.text=Mark Ready for Review
action.Stacklane.MarkReady.description=Mark only this pull request ready for review. The rest of the stack does not change
action.Stacklane.MarkDraft.text=Convert to Draft
action.Stacklane.MarkDraft.description=Turn only this pull request back into a draft. The rest of the stack does not change
action.Stacklane.EditLabels.text=Labels…
action.Stacklane.EditLabels.description=Choose the labels of this pull request. The dialog shows the command before applying it
action.Stacklane.ToggleFinal.text=Toggle Final-Layer Label
action.Stacklane.ToggleFinal.description=Add or remove the label that marks the final layer of the stack
action.Stacklane.CheckoutStackFromPr.text=Check Out Stack Locally
action.Stacklane.CheckoutStackFromPr.description=Fetch this pull request’s stack and switch to it (gh stack checkout)
action.Stacklane.ForgetStack.text=Forget Stack
action.Stacklane.ForgetStack.description=Stop tracking this stack locally: its branches no longer exist. gh stack only does it from one of its branches, so one is created for a moment on the current commit and deleted afterwards. GitHub and your working tree are not touched
action.Stacklane.RecreateStack.text=Recreate on Another Base…
action.Stacklane.RecreateStack.description=Forget this stack and start it again with the same layers on the base you choose, restoring their last commits. The dialog shows every command before running it
group.Stacklane.PullRequest.Menu.text=Stack
group.Stacklane.PullRequest.Menu.description=Stacked pull request actions (Stacklane)

