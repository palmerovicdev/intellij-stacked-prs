rerere.title=Remember Conflict Resolutions?
rerere.text=gh stack asks this in the terminal before rebasing: turn on git rerere in this repository?\n\nGit then remembers how you resolved each conflict and resolves it the same way when it comes back, which happens when a stack is rebased more than once.\n\nTurn On runs git config rerere.enabled true and git config rerere.autoupdate true, as gh stack does. Don’t Turn On runs git config gh-stack.rerere-declined true: neither gh stack nor Stacklane will ask again in this repository.
rerere.enable=Turn On rerere
rerere.decline=Don’t Turn On
