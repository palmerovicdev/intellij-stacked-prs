# Que hace cada opcion; el comando lo anade el codigo (ver ui/Help.kt).
help.rebase.upstack.from=Carry the commits of {0} to the layers above it, without fetching or rebasing onto {1}. If {0} is not the current branch, it is checked out first and you come back afterwards
help.rebase.continue=Continue the stopped rebase once the conflicts are resolved
help.rebase.abort=Stop the rebase and put every branch back where it was
help.resolve.conflicts=Open the IDE merge dialog with the files git left in conflict. Nothing else runs until you continue the rebase
help.layer.changes=Open the IDE diff with what {0} adds on top of {1}: the same changes its pull request shows. If {1} moved on afterwards, the diff starts at their last common commit, so its new commits do not show up as removed
help.change.base=Its pull request targets {0}, but in the stack it sits on {1}. This points it at {1}; nothing else changes. If {0} was the right base, the stack is the one to fix, not the pull request
help.push=Push every layer of the stack, each with --force-with-lease, so the pull requests show the rebased commits. It creates no pull requests
help.checkout.stack=Fetch a stack from GitHub by its number, a pull request number or URL, or a branch name, and switch to it
help.install.extension=Install the gh-stack extension of the GitHub CLI
help.final.add=Mark this pull request as the final layer of the stack with the “{0}” label, and remove the label from any other layer that has it. If the repository has no such label, offers to create it
help.final.remove=Remove the “{0}” label from this pull request
help.final.toggle=Add the “{0}” label to this pull request, or remove it if it already has it: its labels are read first
help.init.base=The branch the stack starts from: any local or remote branch. If you do not choose one, the default branch of the repository
help.init.restore=Recreate each branch at its last known commit before gh stack init adopts it, so its work is kept
help.add.commit=Commit your current changes in the new layer as soon as it is created
help.add.staging.all=Commit every change, untracked files included
help.add.staging.tracked=Commit only the changes to files git already tracks
help.add.staging.staged=Commit only what is already staged
help.publish.ready.new=Checked: the new pull request is marked ready for review right after it is created. Unchecked: it stays a draft
help.publish.ready.existing=Checked: the pull request ends up ready for review; unchecked, a draft. The command runs only if its state changes
help.publish.all.ready=Check every layer: all pull requests end up ready for review
help.publish.all.drafts=Uncheck every layer: all pull requests end up as drafts
help.remote=The remote the stack is pushed to and fetched from. It is added to the gh stack commands that use a remote, and remembered for this project

