pluginGroup = com.upstack
pluginId = com.upstack
pluginName = Upstack
pluginVersion = 0.15.4

# 262 = IntelliJ IDEA 2026.2: la version mas antigua comprobada (la de CI, abajo).
# No se promete nada anterior.
pluginSinceBuild = 262

# Se compila, se ejecuta (runIde) y se verifica (verifyPlugin) contra la IDEA ya
# instalada, ahora 2026.3 (build 263): cero descargas de IDE. Vacio -> camino de CI,
# que descarga platformType/platformVersion.
localIdePath = /Users/victorpalmero/Applications/IntelliJ IDEA.app

# Solo para el camino de CI: 2026.2.2 (build 262.10315.125), la since-build, para que
# CI compruebe la version mas antigua que se promete.
platformType = IU
platformVersion = 2026.2.2

# El toolchain (JDK 25) es el JBR que trae la IDEA instalada. Sin foojay: si esta
# ruta no existe, Gradle falla con un mensaje claro en vez de bajarse un JDK.
org.gradle.java.installations.paths = /Users/victorpalmero/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home
org.gradle.java.installations.auto-download = false

gradleVersion = 9.5.0

# El stdlib de Kotlin lo pone el IDE; empaquetarlo es un aviso del Plugin Verifier.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
# Sin cache de build: con ella, compileTestKotlin e instrumentTestCode devolvian clases de
# test compiladas contra una firma vieja (NoSuchMethodError en tests que estaban bien),
# incluso tras `clean`. Un resultado de test falso cuesta mas que compilar de nuevo.
org.gradle.caching = false
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
