pluginGroup = com.stacklane
pluginId = com.stacklane
pluginName = Stacklane
pluginVersion = 0.4.0

# 262 = IntelliJ IDEA 2026.2. Es la rama del IDE instalado y contra la que se compila:
# no se promete nada anterior que no se haya comprobado.
pluginSinceBuild = 262

# Se compila, se ejecuta (runIde) y se verifica (verifyPlugin) contra la IDEA ya
# instalada: cero descargas de IDE. Vacio -> camino de CI, que descarga
# platformType/platformVersion.
localIdePath = /Applications/IntelliJ IDEA.app

# Solo para el camino de CI. Es la MISMA version que la instalada (2026.2.2, build
# 262.10315.125), para que un build de CI y uno local vean la misma plataforma.
platformType = IU
platformVersion = 2026.2.2

# El toolchain (JDK 25) es el JBR que trae la IDEA instalada. Sin foojay: si esta
# ruta no existe, Gradle falla con un mensaje claro en vez de bajarse un JDK.
org.gradle.java.installations.paths = /Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home
org.gradle.java.installations.auto-download = false

gradleVersion = 9.5.0

# El stdlib de Kotlin lo pone el IDE; empaquetarlo es un aviso del Plugin Verifier.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
# Sin cache de build: con ella, compileTestKotlin e instrumentTestCode devolvian clases de
# test compiladas contra una firma vieja (NoSuchMethodError en tests que estaban bien),
# incluso tras `clean`. Un resultado de test falso cuesta mas que compilar de nuevo.
org.gradle.caching = false
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
